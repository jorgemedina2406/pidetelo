@if (tenant(); as store) {
<div class="min-h-screen bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 pb-28 transition-colors">

  <!-- Store Header (App bar, Hero, Info Card, Horario alert) -->
  <app-store-header
    [tenant]="store"
    [selectedBranch]="cart.selectedBranch()"
    [isStoreOpen]="isStoreOpen()"
    [activeBranchRate]="activeBranchRate()"
    (openBranchModal)="isBranchModalOpen.set(true)">
  </app-store-header>

  <!-- Store Meta & Quick Stats Container -->
  <main class="max-w-5xl mx-auto px-4 mt-3 space-y-4">
    <!-- Store Filters & Search Bar -->
    <app-store-filters
      [categories]="categories()"
      [selectedCategory]="selectedCategory()"
      [specialFilter]="specialFilter()"
      [viewMode]="viewMode()"
      [searchQuery]="searchQuery()"
      [accentColor]="cart.selectedBranch()?.accentColor || store.branding?.accentColor || '#ea580c'"
      (searchQueryChange)="searchQuery.set($event)"
      (viewModeChange)="viewMode.set($event)"
      (categoryChange)="selectedCategory.set($event)"
      (specialFilterChange)="specialFilter.set($event)">
    </app-store-filters>

    <!-- Store Products (Skeleton, Empty State, Grid, List) -->
    <app-store-product-grid
      [products]="filteredProducts()"
      [isLoading]="isLoading()"
      [viewMode]="viewMode()"
      [accentColor]="cart.selectedBranch()?.accentColor || store.branding?.accentColor || '#ea580c'"
      [formatPriceFn]="formatPriceBound"
      (openProduct)="openProductDetail($event)">
    </app-store-product-grid>
  </main>

  <!-- Sticky Bottom Cart Bar -->
  @if (cart.items().length > 0) {
    <div class="fixed bottom-0 inset-x-0 p-4 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-t border-slate-200 dark:border-slate-800 z-40 shadow-xl">
      <div class="max-w-5xl mx-auto flex items-center justify-between gap-4">
        <div (click)="cart.openCart()" class="cursor-pointer">
          <div class="flex items-center gap-2">
            <span class="w-6 h-6 rounded-full text-white text-xs font-bold flex items-center justify-center shadow-xs"
                  [style.backgroundColor]="cart.selectedBranch()?.accentColor || store.branding?.accentColor || '#ea580c'">
              {{ cart.totalItemsCount() }}
            </span>
            <span class="text-xs font-bold text-slate-900 dark:text-white">Ver Tu Pedido</span>
          </div>
          <div class="text-xs text-slate-500 dark:text-slate-400">
            Total: <strong class="text-slate-900 dark:text-white">${{ cart.total().toFixed(2) }}</strong>
          </div>
        </div>

        <button (click)="cart.openCart()"
                [style.backgroundColor]="cart.selectedBranch()?.accentColor || store.branding?.accentColor || '#ea580c'"
                class="text-white font-bold text-xs px-5 py-3 rounded-xl shadow-md transition-all active:scale-95 cursor-pointer hover:opacity-90">
          Ir al Carrito &rarr;
        </button>
      </div>
    </div>
  }

  <!-- Modals -->
  @if (activeModalProduct(); as activeProd) {
    <app-product-detail-modal
      [product]="activeProd"
      (close)="activeModalProduct.set(null)"
      (add)="onProductAdd($event)">
    </app-product-detail-modal>
  }

  <app-cart-drawer></app-cart-drawer>
  <app-checkout-modal></app-checkout-modal>
  <app-order-success-modal></app-order-success-modal>

  <!-- Branch Selector Modal -->
  <app-branch-select-modal
    [isOpen]="isBranchModalOpen()"
    [branches]="store.branches || []"
    [selectedBranchId]="cart.selectedBranch()?.id"
    (close)="isBranchModalOpen.set(false)"
    (selectBranch)="selectBranch($event)">
  </app-branch-select-modal>

</div>
}
