name: Build Android APKs & AABs
# Release build trigger: v1.1.0 Android App Bundle (Google Play) & APK (Direct)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'mobile_app/**'
      - 'rider_app/**'
      - '.github/workflows/build-android.yml'

jobs:
  build-customer-app:
    name: Build Customer App (APK & AAB)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: mobile_app
        run: flutter pub get

      - name: Build APK and AAB
        working-directory: mobile_app
        run: |
          flutter build apk --release
          flutter build appbundle --release
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Pidetelo-Cliente.apk
          cp build/app/outputs/bundle/release/app-release.aab build/app/outputs/bundle/release/Pidetelo-Cliente.aab

      - name: Upload Customer APK
        uses: actions/upload-artifact@v4
        with:
          name: Pidetelo-Cliente-Android-apk
          path: mobile_app/build/app/outputs/flutter-apk/Pidetelo-Cliente.apk
          retention-days: 7

      - name: Upload Customer AAB (Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: Pidetelo-Cliente-GooglePlay-aab
          path: mobile_app/build/app/outputs/bundle/release/Pidetelo-Cliente.aab
          retention-days: 7

  build-rider-app:
    name: Build Rider App (APK & AAB)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: rider_app
        run: flutter pub get

      - name: Build APK and AAB
        working-directory: rider_app
        run: |
          flutter build apk --release
          flutter build appbundle --release
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Pidetelo-Rider.apk
          cp build/app/outputs/bundle/release/app-release.aab build/app/outputs/bundle/release/Pidetelo-Rider.aab

      - name: Upload Rider APK
        uses: actions/upload-artifact@v4
        with:
          name: Pidetelo-Rider-Android-apk
          path: rider_app/build/app/outputs/flutter-apk/Pidetelo-Rider.apk
          retention-days: 7

      - name: Upload Rider AAB (Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: Pidetelo-Rider-GooglePlay-aab
          path: rider_app/build/app/outputs/bundle/release/Pidetelo-Rider.aab
          retention-days: 7
