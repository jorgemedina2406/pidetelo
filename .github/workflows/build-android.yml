name: Build Android APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'mobile_app/**'
      - 'rider_app/**'
      - '.github/workflows/build-android.yml'

jobs:
  build-customer-app:
    name: Build Customer App APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: mobile_app
        run: flutter pub get

      - name: Build APK
        working-directory: mobile_app
        run: flutter build apk --release

      - name: Upload Customer APK
        uses: actions/upload-artifact@v4
        with:
          name: Pidetelo-Cliente-Android-apk
          path: mobile_app/build/app/outputs/flutter-apk/*.apk

  build-rider-app:
    name: Build Rider App APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: rider_app
        run: flutter pub get

      - name: Build APK
        working-directory: rider_app
        run: flutter build apk --release

      - name: Upload Rider APK
        uses: actions/upload-artifact@v4
        with:
          name: Pidetelo-Rider-Android-apk
          path: rider_app/build/app/outputs/flutter-apk/*.apk
