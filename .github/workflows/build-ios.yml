name: Build iOS IPAs (Cliente & Rider)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build iOS (${{ matrix.app }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: mobile_app
            output_name: Pidetelo-Cliente-iOS
          - app: rider_app
            output_name: Pidetelo-Rider-iOS
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd ${{ matrix.app }}
          flutter pub get

      - name: Build iOS (No Codesign)
        run: |
          cd ${{ matrix.app }}
          flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          cd ${{ matrix.app }}/build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r -q "${{ matrix.output_name }}.ipa" Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output_name }}-ipa
          path: ${{ matrix.app }}/build/ios/iphoneos/${{ matrix.output_name }}.ipa
