name: Build iOS IPAs (Cliente & Rider)

on:
  workflow_dispatch:
    inputs:
      target_app:
        description: 'Aplicación a compilar'
        required: true
        default: 'ambas'
        type: choice
        options:
          - ambas
          - cliente
          - rider
  push:
    branches:
      - main
      - master

jobs:
  build-cliente:
    name: Build iOS (Cliente)
    runs-on: macos-latest
    if: github.event_name == 'push' || github.event.inputs.target_app == 'ambas' || github.event.inputs.target_app == 'cliente'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd mobile_app
          flutter pub get

      - name: Build iOS (No Codesign)
        run: |
          cd mobile_app
          flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          cd mobile_app/build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r -q "Pidetelo-Cliente-iOS.ipa" Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pidetelo-Cliente-iOS-ipa
          path: mobile_app/build/ios/iphoneos/Pidetelo-Cliente-iOS.ipa

  build-rider:
    name: Build iOS (Rider)
    runs-on: macos-latest
    needs: [build-cliente]
    if: always() && (github.event_name == 'push' || github.event.inputs.target_app == 'ambas' || github.event.inputs.target_app == 'rider')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd rider_app
          flutter pub get

      - name: Build iOS (No Codesign)
        run: |
          cd rider_app
          flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          cd rider_app/build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r -q "Pidetelo-Rider-iOS.ipa" Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pidetelo-Rider-iOS-ipa
          path: rider_app/build/ios/iphoneos/Pidetelo-Rider-iOS.ipa
