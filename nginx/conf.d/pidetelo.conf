# ========================================================
# PÍDETELO - CONFIGURACIÓN DE SITIOS VIRTUALES NGINX
# ========================================================

upstream backend_service {
    server backend:3000;
    keepalive 32;
}

# --------------------------------------------------------
# 1. Redirección HTTP -> HTTPS y Validación SSL Certbot
# --------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name pidetelo.app www.pidetelo.app app.pidetelo.app api.pidetelo.app;

    # Directorio para validación de certificados SSL con Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirigir todo el tráfico normal a HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# --------------------------------------------------------
# 2. BACKEND API & WHATSAPP (api.pidetelo.app)
# --------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.pidetelo.app;

    # Certificados SSL (Let's Encrypt o Cloudflare Origin)
    ssl_certificate /etc/letsencrypt/live/pidetelo.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pidetelo.app/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Cabeceras de seguridad
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Timeout extendido para subidas y conexiones WhatsApp
    proxy_connect_timeout 90s;
    proxy_send_timeout 90s;
    proxy_read_timeout 90s;

    location / {
        proxy_pass http://backend_service;
        proxy_http_version 1.1;

        # Soporte nativo para WebSockets y Server-Sent Events
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Reenviar IP real del cliente (crucial para telemetría y seguridad)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
    }
}

# --------------------------------------------------------
# 3. WEB APP - COMERCIOS & ADMIN (app.pidetelo.app)
# --------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.pidetelo.app;

    ssl_certificate /etc/letsencrypt/live/pidetelo.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pidetelo.app/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    root /var/www/web-app;
    index index.html;

    # Cabeceras de seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Caché optimizada para assets compilados de Angular
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # SPA Routing (evita el error 404 al recargar rutas de Angular)
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# --------------------------------------------------------
# 4. LANDING PAGE & DESCARGAS (pidetelo.app)
# --------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pidetelo.app www.pidetelo.app;

    ssl_certificate /etc/letsencrypt/live/pidetelo.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pidetelo.app/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    root /var/www/landing;
    index index.html;

    # Descarga directa de APKs e IPAs a máxima velocidad
    location /descargas/ {
        alias /var/www/downloads/;
        autoindex off;
        add_header Content-Disposition "attachment";
        add_header Cache-Control "no-cache";
    }

    # Caché de imágenes y estilos de la landing
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

